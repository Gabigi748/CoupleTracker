name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS platform
        run: |
          # Try to install iOS runtime; if it fails, list what's available
          xcodebuild -downloadPlatform iOS 2>&1 || true
          # List available runtimes
          xcrun simctl list runtimes 2>/dev/null || true

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: CoupleTracker
          options:
            bundleIdPrefix: com.fish
            deploymentTarget:
              iOS: "17.0"
            xcodeVersion: "16.0"
          settings:
            base:
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
          targets:
            CoupleTracker:
              type: application
              platform: iOS
              sources:
                - path: App
                  excludes:
                    - "Info.plist"
                - path: Models
                - path: Services
                - path: Views
                - path: Utils
              info:
                path: App/Info.plist
                properties:
                  CFBundleDisplayName: "小寧和魚魚"
                  UILaunchScreen:
                    UIColorName: ""
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSLocationWhenInUseUsageDescription: "「小寧和魚魚」需要您的位置來即時顯示在地圖上，讓對方知道你在哪裡"
                  NSLocationAlwaysAndWhenInUseUsageDescription: "請選擇「永遠允許」，這樣即使 App 在背景也能持續更新位置給對方"
                  NSLocationAlwaysUsageDescription: "請選擇「永遠允許」，這樣即使 App 在背景也能持續更新位置給對方"
                  NSMotionUsageDescription: "「小寧和魚魚」需要偵測您的移動狀態（走路、開車等），以智慧調整定位精度並通知對方"
                  NSSupportsLiveActivities: true
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIBackgroundModes:
                    - location
                    - fetch
                    - remote-notification
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.fish.coupletracker
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "6.0"
            CoupleTrackerWidget:
              type: app-extension
              platform: iOS
              sources:
                - path: CoupleTrackerWidget
              info:
                path: CoupleTrackerWidget/Info.plist
                properties:
                  CFBundleDisplayName: "CoupleTracker Widget"
                  NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.fish.coupletracker.widget
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "6.0"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
              dependencies:
                - target: CoupleTracker
                  embed: false
          EOF
          
          brew install xcodegen
          xcodegen generate
          
          echo "=== Verify Info.plist contents ==="
          cat App/Info.plist | head -50
          echo "=== Check generated project plist setting ==="
          grep -A2 "INFOPLIST" CoupleTracker.xcodeproj/project.pbxproj | head -10

      - name: Build for iOS Simulator (Debug)
        continue-on-error: true
        run: |
          xcodebuild build \
            -project CoupleTracker.xcodeproj \
            -scheme CoupleTracker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -100 || true

      - name: Archive for iOS (Release)
        run: |
          xcodebuild archive \
            -project CoupleTracker.xcodeproj \
            -scheme CoupleTracker \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CoupleTracker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            ASSETCATALOG_COMPILER_SKIP_VALIDATION=YES

      - name: Verify IPA Info.plist
        if: always()
        run: |
          echo "=== Check archived Info.plist ==="
          if [ -f "build/CoupleTracker.xcarchive/Products/Applications/CoupleTracker.app/Info.plist" ]; then
            plutil -p "build/CoupleTracker.xcarchive/Products/Applications/CoupleTracker.app/Info.plist" | grep -i "location\|background"
          else
            echo "No Info.plist found in archive!"
            find build/CoupleTracker.xcarchive -name "Info.plist" 2>/dev/null
          fi

      - name: Export unsigned IPA
        run: |
          mkdir -p build/ipa
          if [ -d "build/CoupleTracker.xcarchive/Products/Applications" ]; then
            cd build/CoupleTracker.xcarchive/Products/Applications
            mkdir -p Payload
            cp -r *.app Payload/
            zip -r ../../../ipa/CoupleTracker-unsigned.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Archive failed - no .app found"
            find build/CoupleTracker.xcarchive -type d 2>/dev/null || echo "No archive found"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoupleTracker-unsigned
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload archive (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoupleTracker-archive
          path: build/CoupleTracker.xcarchive
          if-no-files-found: warn
